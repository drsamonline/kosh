name: fuzz

# CT-4 at full size. The suite runs 400 random mutations on every push; 10⁵ takes
# about three minutes, which is a job of its own rather than a tax on every PR.
#
# Nightly and on demand. A corruption bug that only appears at 10⁵ samples is
# exactly the kind that a 400-sample run will keep quiet about for months.

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: 'mutations to run'
        required: false
        default: '100000'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 100 000 mutations, and the exhaustive single-bit sweep
        env:
          KOSH_FUZZ: ${{ inputs.runs || '100000' }}
        run: pytest tests/test_fuzz.py -q
