name: fuzz

# The randomised work, at full size. CT-4 runs 400 random mutations on every push
# and 10⁵ here; CT-3 runs 1 000 generated round-trips on every push and the
# roadmap's 10 000 here. Both cost minutes, which is why they are a job of their
# own rather than a tax on every PR.
#
# Nightly and on demand. A corruption bug that only appears at 10⁵ samples is
# exactly the kind that a 400-sample run will keep quiet about for months.

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: 'mutations to run'
        required: false
        default: '100000'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 100 000 mutations, and the exhaustive single-bit sweep
        env:
          KOSH_FUZZ: ${{ inputs.runs || '100000' }}
        run: pytest tests/test_fuzz.py -q

      - name: 10 000 generated round-trips (CT-3), the roadmap's exit test
        # The push suite runs a tenth of this: every case writes files, and every
        # write fsyncs, so the full set costs about three and a half minutes. Same
        # split as the fuzzing above, and for the same reason.
        env:
          KOSH_PROPERTY_CASES: full
        run: pytest tests/test_properties.py -q
